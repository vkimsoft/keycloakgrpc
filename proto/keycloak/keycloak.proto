syntax = "proto3";

package auth;

option go_package = "github.com/vkimsoft/keycloakgrpc/protos/gen/keycloak;keycloackproto";

// Auth is service for managing permissions and roles.
service Auth {
	rpc ClientConnect(SetConnectRequest) returns (ServerResponse);
	rpc GetClient(LoginRequest) returns (ServerResponse);
	// Register registers a new user.
  //rpc Register (RegisterRequest) returns (RegisterResponse);
  // Login logs in a user and returns an auth token.
  rpc Login (LoginRequest) returns (LoginResponse);
	rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse);
  // IsAdmin checks whether a user is an admin.
  rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
}

// message SetLoginRequest{
//     string user = 1;
//     string password = 2;
// 		string realmName =3;
// }
message IsAdminRequest {
  string user_id = 1; // User ID to validate.
}
message IsAdminResponse {
  bool is_admin = 1;  // Indicates whether the user is an admin.
}
/*
message RegisterRequest {
  string email = 1; // Email of the user to register.
  string password = 2; // Password of the user to register.
}
message RegisterResponse {
  string user_id = 1; // User ID of the registered user.
}
*/
message LoginRequest {
	string user = 1;
  string email = 2; // Email of the user to login.
  string password = 3; // Password of the user to login.
	string realmName =4;
  //int32 app_id = 3; // ID of the app to login to.
}
message LoginResponse {
	//gocloak.JWT token=1;
	string AccessToken = 1;
	//string IDToken=2;         
	int64 ExpiresIn=2;
	int64 RefreshExpiresIn=3;
	string RefreshToken=4;
	string TokenType=5;
	int32 NotBeforePolicy=6;
	string SessionState=7;
	string Scope=8;
  //string token = 1; // Auth token of the logged in user.
}

message LogoutRequest {
	string userId=1;
  optional string refreshToken = 2; // Auth token of the user to logout.
	optional string accessToken=3;
}
message LogoutResponse {
  bool success = 1; // Indicates whether the logout was successful.
}

message SetConnectRequest{
	 string clientID=1;
	 string clientSecret=2;
	 string realm=3;
}
message GetRequest{
    string key = 1;
}

// Server Response
message ServerResponse{
    bool success = 1;
    string value = 2;
    string error = 3;
}

message UserInfoRequest{
  string realm=1;
 	string accessToken=2;
}

message RowOfStrings {
  repeated string row = 1;
}

message ArrayOfStrings {
  repeated RowOfStrings col = 1;
}
message UserInfoResponse{
  string Id=1;
	string Realm_id=2;
	string Username=3;
	bool Enabled=4;
	bool EmailVerified=5;
	string FirstName=6;
	string LastName=7;
	string Email=8;
	ArrayOfStrings Attributes=9;
	repeated string Access=10;
	ArrayOfStrings ClientRoles=11;
	repeated string RealmRoles=12;
	repeated string Groups=13;
 repeated string Credentials=14;
	// 	Attributes                 map[string][]string `json:"attributes,omitempty"`
	// DisableableCredentialTypes []interface{}       `json:"disableableCredentialTypes,omitempty"`
	// RequiredActions            []string            `json:"requiredActions,omitempty"`
	// Access                     map[string]bool     `json:"access,omitempty"`
	// ClientRoles                map[string][]string `json:"clientRoles,omitempty"`
	// RealmRoles                 []string            `json:"realmRoles,omitempty"`
	// Groups                     []string            `json:"groups,omitempty"`
	// ServiceAccountClientID     string              `json:"serviceAccountClientId,omitempty"`
	// Credentials                []any               `json:"credentials,omitempty"`
}