syntax = "proto3";

package auth;

option go_package = "vkimsoft/keycloakgrpc/protos/gen/keycloak;keycloackproto";

// Auth is service for managing permissions and roles.
service Auth {
	rpc ClientConnect(SetConnectRequest) returns (ServerResponse);
	rpc GetClient(LoginRequest) returns (ServerResponse);
	// Register registers a new user.
  //rpc Register (RegisterRequest) returns (RegisterResponse);
  // Login logs in a user and returns an auth token.
  rpc Login (LoginRequest) returns (LoginResponse);
	rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse);
	rpc RefreshToken (RefreshRequest) returns (RefreshResponse);
  // IsAdmin checks whether a user is an admin.
  rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
	rpc GetUserSessions(UserSessionRequest) returns (UserSessionListResponse);
	rpc AccessLevel(ModulesRequest) returns (AccessRoleModulesResponse);
	rpc GetRoles(RoleRequest) returns (RoleListResponse);
	rpc GetUserRoles(RoleRequest) returns (RoleListResponse);
	rpc GetApplications(ApplicationsRequest) returns (ApplicationsResponse);
	rpc UserApplications(ApplicationsRequest) returns (UserApplicationsResponse);
	rpc GetUsers(UsersRequest) returns (UsersResponse);
}

// message SetLoginRequest{
//     string user = 1;
//     string password = 2;
// 		string realmName =3;
// }
message IsAdminRequest {
  string user_id = 1; // User ID to validate.
}
message IsAdminResponse {
  bool is_admin = 1;  // Indicates whether the user is an admin.
}
/*
message RegisterRequest {
  string email = 1; // Email of the user to register.
  string password = 2; // Password of the user to register.
}
message RegisterResponse {
  string user_id = 1; // User ID of the registered user.
}
*/
message LoginRequest {
	string user = 1;
  string email = 2; // Email of the user to login.
  string password = 3; // Password of the user to login.
	string realmName =4;
  //int32 app_id = 3; // ID of the app to login to.
}
message LoginResponse {
	//gocloak.JWT token=1;
	string AccessToken = 1;
	//string IDToken=2;         
	int64 ExpiresIn=2;
	int64 RefreshExpiresIn=3;
	string RefreshToken=4;
	string TokenType=5;
	int32 NotBeforePolicy=6;
	string SessionState=7;
	string Scope=8;
	UserInfoResponse UserInfo=9;
  //string token = 1; // Auth token of the logged in user.
}

message LogoutRequest {
	string userId=1;
  optional string refreshToken = 2; // Auth token of the user to logout.
	optional string accessToken=3;
}
message LogoutResponse {
  bool success = 1; // Indicates whether the logout was successful.
}

message SetConnectRequest{
	 string clientID=1;
	 string clientSecret=2;
	 string realm=3;
}
message GetRequest{
    string key = 1;
}

// Server Response
message ServerResponse{
    bool success = 1;
    string value = 2;
    string error = 3;
}

message UserInfoRequest{
  string realm=1;
	string user_id=2;
 	string accessToken=3;
}

message RowOfStrings {
  repeated string row = 1;
}

message ArrayOfStrings {
  RowOfStrings col = 1;
}
message UserInfoResponse{
  string Id=1;
	string Realm_id=2;
	string Username=3;
	bool Enabled=4;
	bool EmailVerified=5;
	string FirstName=6;
	string LastName=7;
	string Email=8;
	map<string, string> Attributes=9;
	repeated string Access=10;
	//ArrayOfStrings ClientRoles=11;
	repeated string RealmRoles=12;
	repeated string Groups=13;
  string Name=14;
	string Scope=15;
  string SessionState=16;
	int64 ExpiresAt=17;
	// 	Attributes                 map[string][]string `json:"attributes,omitempty"`
	// DisableableCredentialTypes []interface{}       `json:"disableableCredentialTypes,omitempty"`
	// RequiredActions            []string            `json:"requiredActions,omitempty"`
	// Access                     map[string]bool     `json:"access,omitempty"`
	// ClientRoles                map[string][]string `json:"clientRoles,omitempty"`
	// RealmRoles                 []string            `json:"realmRoles,omitempty"`
	// Groups                     []string            `json:"groups,omitempty"`
	// ServiceAccountClientID     string              `json:"serviceAccountClientId,omitempty"`
	// Credentials                []any               `json:"credentials,omitempty"`
}

message RefreshRequest{
	string RefreshToken=1;
	string userID=2;
	string clientID=3;
	string clientSecret=4;
	string realm=5;
}
message RefreshResponse {
	string AccessToken = 1;       
	int64 ExpiresIn=2;
	int64 RefreshExpiresIn=3;
	string RefreshToken=4;
	string TokenType=5;
	int32 NotBeforePolicy=6;
	string SessionState=7;
	string Scope=8;
}

message UserSessionRequest {
	string realm=1;
	string clientUuid=2;
}

message UserSessionResponse {
string id=1;
string username=2;
string userId=3;
string ipAddress=4;
int64 start =5;
int64 lastAccess=6;
bool rememberMe=7;
map<string, string> clients=8;
bool transientUser=9;
string email=10;
string names=11;
}
message UserSessionListResponse {
    repeated UserSessionResponse sessions = 1;
}

message Modules{
  string moduleName=1;
  string description=2;
  bool isActive=3;
}
message ModulesRequest{
	string AccessToken = 1;  
  string moduleName=2;
}

message AccessRoleModulesResponse {    
 string roleName=1;
 Modules moduleName=2;
 int32 level=3;
 bool isActive=4;
}
message RoleRequest{
	string AccessToken = 1;  
	string id=2;
	string description=3;
	string realm_id=4;
}
message RoleResponse {
 string id=1;
 string client_realm_constraint=2;
 bool client_role=3;
 string description=4;
 string name=5;
 string realm_id=6;
 string client=7;
}
message RoleListResponse {
    repeated RoleResponse roles = 1;
}

message ApplicationsRequest {   
	string AccessToken = 1;  
	string id=2;
	string realm_id=3;
}

message Applications {   
 int32 id=1;        
 string title=3;
 string url=4;
 bool enabled=5;
 string action=6;
}
message UserApplications {  
 string user_id=1;   
 Applications application=2;
}

message ApplicationsResponse {
	repeated Applications applications = 1; 
}
message UserApplicationsResponse {
   repeated UserApplications userapplications = 1; 
}

message UsersRequest {   
	string AccessToken = 1;  
	string realm_id=2;
}
message UsersResponse {
   repeated UserInfoResponse users = 1; 
}