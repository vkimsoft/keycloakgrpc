# See: https://taskfile.dev/api/

version: "3"

tasks:
  generate:
    aliases:
      - gen
    desc: "Generate code from proto files"
    cmds:
     # - protoc --plugin=protoc-gen-grpc-web=protoc-gen-grpc-web proto/pubsub/*.proto --js_out=import_style=commonjs:./gen/go/ --go-grpc-web_out=import_style=typescript,mode=grpcwebtext:./gen/go/
      - protoc -I proto proto/keycloak/*.proto --go_out=./gen/ --go_opt=paths=source_relative --go-grpc_out=./gen/ --go-grpc_opt=paths=source_relative

